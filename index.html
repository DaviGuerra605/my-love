<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Luana ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffd6e5, #fff0f6);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            color: #444;
        }

        .caixa {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 8px 30px #0002;
        }

        h1 {
            color: #e91e63;
            font-size: 30px;
        }

        .pergunta {
            font-size: 22px;
            margin: 25px 0;
        }

        button {
            border: none;
            padding: 15px 35px;
            margin: 8px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        #sim {
            background: #ff4f81;
            color: white;
        }

        #nao {
            background: #eee;
            color: #444;
        }

        #resposta {
            margin-top: 30px;
            font-size: 17px;
            line-height: 1.7;
            text-align: left;
            white-space: pre-line;
        }

        .gato {
            font-family: monospace;
            white-space: pre;
            text-align: center;
            margin-top: 30px;
            font-size: 18px;
        }

        .coracao {
            font-size: 35px;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <div class="coracao">❤️</div>

        <h1>Uma perguntinha para você...</h1>

        <div class="pergunta">
            Luana, você sabia que eu te amo?
        </div>

        <button id="sim">SIM ❤️</button>
        <button id="nao">NÃO 😳</button>

        <div id="resposta"></div>

        <div class="gato">
       🌸
        |
  /\_/\\
 ( o.o )
  > ^ <
 /|   |\\
(_|   |_)
   |   |
   |___|
        </div>

    </div>

    <script>

        document.getElementById("sim").onclick = function() {

            document.getElementById("resposta").innerHTML = `
            Luana, eu só queria que você soubesse o quanto eu te amo. ❤️

            Você é meu pensamento todos os dias, a primeira pessoa que vem na minha cabeça quando acordo e uma das últimas antes de dormir.

            Eu não consigo imaginar minha vida sem você, porque você se tornou uma parte tão importante de mim.

            Eu admiro tudo em você: seu jeito, seu sorriso, seu olhar, sua personalidade, sua força e até as pequenas coisas que talvez você nem perceba.

            Pra mim, você é simplesmente maravilhosa, linda, incrível e uma verdadeira obra de arte.

            Você é minha princesa, meu amor, minha felicidade e meu orgulho.

            Eu te amo mais do que consigo colocar em palavras e espero conseguir te lembrar disso todos os dias. ❤️
            `;

        };


        document.getElementById("nao").onclick = function() {

            document.getElementById("resposta").innerHTML = `
            COMO ASSIM VOCÊ NÃO SABIA??? 😭❤️

            Eu te amo MUITOOOOOOO!

            Você é meu pensamento diário, a pessoa que eu mais admiro e alguém que eu nunca quero perder.

            Você é linda, maravilhosa, incrível e uma das melhores coisas que já aconteceram na minha vida.

            Eu amo seu sorriso, seu jeito, sua personalidade, seu olhar e cada pequeno detalhe que faz você ser você.

            Pra mim, você é uma verdadeira obra de arte, minha princesa, meu amor e minha felicidade. ❤️

            Então agora você sabe:

            EU TE AMO, E MUITOOOOOO! <3
            `;

        };

    </script>

</body>
</html>
